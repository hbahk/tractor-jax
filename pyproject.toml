[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tractor-jax"
dynamic = ["version"]
description = "JAX-accelerated astronomical image modeling and forced photometry"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Hyeonguk Bahk", email = "bahkhyeonguk@gmail.com" },
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy",
    "scipy",
    "jax",
    "astropy",
    "photutils",
]

[project.urls]
Homepage = "https://github.com/hbahk/tractor-jax"
Documentation = "https://tractor-jax.readthedocs.io"
Source = "https://github.com/hbahk/tractor-jax"

[project.optional-dependencies]
docs = [
    "sphinx>=7",
    "pydata-sphinx-theme",
    "myst-parser",
    "sphinx-copybutton",
]
dev = [
    "matplotlib",
    "tqdm",
    "pyarrow",  # for parquet I/O in tests
]

[tool.setuptools.dynamic]
version = { attr = "tractor_jax.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["tractor_jax*"]
