name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest
      - name: Run tests (CPU, 2 virtual devices)
        env:
          JAX_PLATFORMS: cpu
          XLA_FLAGS: --xla_force_host_platform_device_count=2
        run: pytest tests/ -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with docs extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build docs (warnings are errors)
        run: python -m sphinx -T -W --keep-going -b html docs docs/_build/html
